<script>
const D = {"book": [["philosophy", "[fəˈlɒsəfi]", "n. 哲学；人生信条；经营理念", "philosophical <i>adj.</i> 哲学的", "business philosophy 经营理念；operating philosophy 经营信条", "We adhere to such operating philosophy as “Innovation, Quality, Service, Gratitude”.", "我们始终坚持“创新、质量、服务、感恩”的经营理念。"], ["rotation", "[rəʊˈteɪʃn]", "n. 轮换；交替；（旋转的）一周", "rotate <i>v.</i> （使）旋转；轮流", "picture rotation 轮播图；in rotation 轮流地", "Picture rotation is generally located below the shop sign, displaying the advertising pictures in turns.", "轮播图一般位于店招下方，依次展示广告图片。"], ["sign", "[saɪn]", "<i>v.</i> 签署；签名　<i>n.</i> 标志；招牌；迹象", "signature <i>n.</i> 签名；signal <i>n.</i> 信号", "shop sign 店招；sign a contract 签订合同", "Shop sign appears at the top of home page and shows the features of the store.", "店招出现在首页顶部，展示店铺的特色。"], ["profit", "[ˈprɒfɪt]", "<i>n.</i> 利润；收益　<i>v.</i> 获益", "profitable <i>adj.</i> 盈利的；profitability <i>n.</i> 盈利能力；profit margin 利润率", "net profit 净利润；make a profit 获利", "Burst sells are hot products, but they are not the source of profits for shops.", "爆款是热销产品，但并不是店铺利润的来源。"], ["normal", "[ˈnɔːml]", "<i>adj.</i> 正常的；一般的　<i>n.</i> 常态；通常标准", "normally <i>adv.</i> 通常；abnormal <i>adj.</i> 反常的", "return to normal 恢复正常；the normal price 正常价格", "Unlike the normal leather sofa, this sofa will give you a different using experience.", "与普通皮沙发不同，这款沙发会给你不一样的使用体验。"], ["apartment", "[əˈpɑːtmənt]", "n. 公寓；（通常指在同一楼层的）公寓套房", "flat <i>n.</i> 公寓（英式）；studio apartment 单间公寓", "a small apartment 小户型公寓", "This small space reversible sectional sofa is perfect for my small apartment, upstairs, loft and more.", "这款小空间可翻转组合沙发非常适合小公寓、楼上、阁楼等空间。"], ["maximize", "[ˈmæksɪmaɪz]", "<i>vt.</i> 最大化；使增加到最大限度", "maximum <i>n./adj.</i> 最大值（的）；反义 minimize <i>v.</i> 最小化", "maximize profit 最大化利润；maximize the use of characters 用满字符数", "A good title allows your products to be searched by buyers and maximizes the page views of products.", "好的标题能让产品被买家搜到，并使产品浏览量最大化。"], ["category", "[ˈkætəɡəri]", "n. 类别；（人或事物的）种类", "复数 categories；categorize <i>v.</i> 分类", "product category 产品类别；the same category 同一类别", "Many products belong to the same category, so we can use title templates to save workload.", "很多产品属于同一类别，我们可以使用标题模板来减少工作量。"]], "core": [["neglect", "v. 忽视；忽略", "negligence <i>n.</i> 疏忽；negligent <i>adj.</i> 疏忽的", "cannot be neglected 不容忽视", "Store description shows the advantages and strength of the store and thus cannot be neglected.", "店铺描述要展示店铺的优势和实力，因此不容忽视。"], ["visual", "adj. 视觉的；形像化的", "visually <i>adv.</i> 视觉上地", "visual marketing tools 视觉营销工具；visual impact 视觉冲击", "The personal store description pays more attention to visual marketing tools such as store decoration.", "个人店铺描述更注重店铺装修等视觉营销工具。"], ["patent", "n. 专利权；专利证书", "patented <i>adj.</i> 授予专利的", "apply for a patent 申请专利", "Our products are protected by patent, so please do not copy the design.", "我们的产品受专利保护，请勿抄袭设计。"], ["philosophy", "n. 人生信条；人生哲学", "philosophical <i>adj.</i>", "business philosophy 经营理念", "Our business philosophy ensures our responsibility of product quality.", "我们的经营理念保证了产品质量责任。"], ["credible", "adj. 可信的；可靠的", "credibility <i>n.</i> 可信度", "make the store more credible 使店铺更可信", "Detailed product description and high quality pictures make a store more credible.", "详细的产品描述和高质量的图片让一家店铺更加可信。"], ["rotation", "n. 轮换；交替", "rotate <i>v.</i>", "picture rotation 轮播图", "It should be noted that the size and proportion of pictures for the use of picture rotation must be uniform.", "需要注意的是，轮播图的图片尺寸和比例必须统一。"], ["alternately", "adv. 交替地；轮流地", "alternate <i>adj./v.</i> 交替（的）", "use links alternately 交替使用链接", "We can use links of the home page, activities, or products alternately according to the goals of marketing campaigns.", "我们可以根据营销活动的目标交替使用首页、活动或产品链接。"], ["campaign", "n. 运动；（社会、商业或政治目的的）一系列有计划的活动", "campaigner <i>n.</i> 活动家", "marketing campaign 营销活动；advertising campaign 广告活动", "We can use links alternately according to the goals of marketing campaigns to make the full use of the shop sign.", "我们可以根据营销活动的目标交替使用链接，充分利用店招。"], ["intuitive", "adj. 直观的；易懂的", "intuition <i>n.</i> 直觉", "intuitive and vivid 直观生动", "Picture rotation shows the characteristics of products in a more intuitive and vivid way.", "轮播图以更直观、更生动的方式展示产品特点。"], ["proportion", "n. 比例", "proportional <i>adj.</i> 成比例的", "the size and proportion 尺寸和比例", "The size and proportion of pictures for the use of picture rotation must be uniform.", "轮播图的图片尺寸和比例必须统一。"], ["crucial", "adj. 至关重要的；关键性的", "crucially <i>adv.</i>", "be crucial to 对……至关重要", "Title description is usually the first step of releasing products, and is crucial to cross-border e-commerce products.", "标题描述通常是发布产品的第一步，对跨境电商产品至关重要。"], ["keyword", "n. 关键词；关键字", "key words 关键词组", "core words 核心词；long tail keywords 长尾关键词；hot keywords 热词", "When buyers select products on cross-border e-commerce platforms, they often search through keywords.", "买家在跨境电商平台选购产品时，通常通过关键词搜索。"], ["maximize", "v. 使增加到最大限度", "maximum <i>n.</i>", "maximize page views 最大化浏览量", "A good title maximizes the page views of products, increases product exposure, improves product ranking.", "好的标题能让产品浏览量最大化、增加产品曝光、提升产品排名。"], ["exposure", "n. 曝光；曝光量", "expose <i>v.</i> 使暴露", "increase product exposure 增加产品曝光", "A good title increases product exposure and stimulates buyers' desire to buy.", "好的标题能增加产品曝光，激发买家的购买欲望。"], ["stimulate", "v. 促进；激发；激励", "stimulus <i>n.</i> 刺激", "stimulate one's desire to buy 激发购买欲", "A good title description should stimulate buyers' desire to buy directly after they see the title.", "好的标题应让买家一看到标题就直接产生购买欲望。"], ["accurate", "adj. 准确的；精确的", "accuracy <i>n.</i> 准确性", "the most accurate keywords 最准确的关键词", "We must put the core and most accurate keywords of products in the title description.", "我们必须把产品的核心词和最准确的关键词放进标题描述。"], ["attribute", "n. 属性；特征", "attribute <i>v.</i> 把……归因于（attribute to）", "product attributes 产品属性", "Attribute words are used to describe products' attributes, such as color, size, material and style.", "属性词用于描述产品的颜色、尺寸、材质、风格等属性。"], ["conscientious", "adj. 认真的；尽责的；小心谨慎的", "conscience <i>n.</i> 良心", "be conscientious about 对……一丝不苟", "If we are conscientious about each title description, the workload is too heavy.", "如果我们对每条标题都一丝不苟地编写，工作量就太大了。"], ["template", "n. 样板；模板；范例", "templet <i>n.</i> 同 template", "title templates 标题模板", "For the same category of products, we can use title templates.", "对于同一类别的产品，我们可以使用标题模板。"], ["accordingly", "adv. 相应地；因此", "according to 根据", "change ... accordingly 相应调整", "The core words stay the same, and we change attribute words accordingly.", "核心词保持不变，相应地更换属性词。"], ["coherent", "adj. 有条理的；清楚易懂的", "coherence <i>n.</i> 连贯性", "clear and coherent 清晰有条理", "Make the title as clear and coherent as possible.", "标题要尽可能清晰、有条理。"], ["burst", "n. 爆发", "burst into 突然……", "burst sells 爆款", "Burst sells are hot products, with high flow, high exposure, large orders and other characteristics.", "爆款是热销产品，具有高流量、高曝光、大订单量等特点。"], ["promote", "v. 促进；推销", "promotion <i>n.</i> 促销；promotion period 促销期", "promote the sale of 促进……的销售", "Create burst sells by reducing prices and increasing discount rates, which will promote the sale of other products.", "通过降价、提高折扣率打造爆款，从而带动其他产品的销售。"], ["profitability", "n. 盈利能力；收益性", "profitable <i>adj.</i>；profit <i>n.</i>", "profitable products 利润款", "Profitable products are the main source of profits for shops.", "利润款产品是店铺利润的主要来源。"], ["reserve", "v. 储备；保留；预留", "reservation <i>n.</i> 预订；保留", "reserve discount space 预留折扣空间", "The seller should reserve discount space for profitable products.", "卖家应为利润款产品预留折扣空间。"], ["peak", "n. 最高点；顶点", "peak <i>adj.</i> 高峰的", "flow peak 流量高峰；peak season 旺季", "The seller can discount them during the flow peak of platform or promotion period.", "卖家可以在平台流量高峰期或促销期对它们进行打折。"], ["comprehensive", "adj. 广泛的；全面的", "comprehensively <i>adv.</i>", "a comprehensive understanding 全面的了解", "We need to have a more comprehensive understanding of the product category.", "我们需要对产品类别有更全面的了解。"], ["common", "adj. 相同的；共有的；常见的", "commonly <i>adv.</i>", "common skills and tricks 常用技巧", "Although the major platforms have different rules, some tips of product description are common.", "尽管各大平台规则不同，但产品描述的一些技巧是通用的。"], ["dispute", "n. 纠纷", "dispute <i>v.</i> 争议", "follow-up disputes 后续纠纷；trade dispute 贸易纠纷", "Truthfully describe the products, otherwise there will be follow-up disputes such as products not as described.", "如实描述产品，否则会出现“货不对板”等后续纠纷。"], ["load", "v. 加载；载入", "loading time 加载时间；download 下载", "loading time 加载时间", "Do not include too many pictures, otherwise the loading time will be too long.", "不要放太多图片，否则加载时间会太长。"], ["custom", "adj. 定做的；定制的", "customer <i>n.</i> 顾客；customize <i>v.</i> 定制", "custom modules 自定义模块；customized contents 定制内容", "We can show our products and store more comprehensively by adding customized contents.", "我们可以通过添加定制内容，更全面地展示产品和店铺。"], ["module", "n. 模块；组件", "modular <i>adj.</i> 模块化的", "module of recommended products 推荐商品模块", "A store can add more than one module of recommended products.", "一家店铺可以添加不止一个推荐商品模块。"]], "phrases": [["business scope", "业务范围；经营范围", "Our business scope covers men's and women's clothing.", "我们的业务范围是男女服装。"], ["corporate culture", "企业文化", "Our actions must be consistent with the corporate culture.", "我们的行为必须与企业文化一致。"], ["supply channel", "供货渠道", "Due to the different supply channels, the price of clothing may vary a lot.", "由于供货渠道不同，服装的价格可能相差甚远。"], ["return policy", "退货政策", "We offer a 30-day return policy to protect buyers' rights.", "我们提供30天退货政策，保障买家权益。"], ["after-sales service", "售后服务", "Include logistics, payment, after-sales service and other information in the product description.", "在产品描述中包含物流、支付、售后服务等信息。"], ["consistent with", "符合；与……一致", "The store style should be consistent with our main business scope or brand image.", "店铺风格应与我们的主营业务范围或品牌形象一致。"], ["brand image", "品牌形象", "Apple is known for its innovative brand image.", "苹果以其创新的品牌形象而闻名。"], ["in turns", "依次；轮流", "Picture rotation displays the advertising pictures in turns.", "轮播图依次展示广告图片。"], ["customer stickiness", "用户黏性", "Showing social media accounts helps increase customer stickiness and loyalty.", "展示社交媒体账号有助于增加用户黏性和忠诚度。"], ["release products", "发布产品", "Title description is usually the first step of releasing products.", "标题描述通常是发布产品的第一步。"], ["consist of", "由……组成；由……构成；包括", "Title description consists of core words, attribute words and long tail keywords.", "标题描述由核心词、属性词和长尾关键词组成。"], ["plus size", "大尺码；加大码", "“Plus size” is a long tail keyword that can bring more page views.", "“大码”是能带来更多浏览量的长尾关键词。"], ["a variety of", "各种各样的；多种的", "Under the category of women's dress, we may upload a variety of products.", "在女装连衣裙类别下，我们可能上传各种各样的产品。"], ["a series of", "一系列；一连串", "In this way, we can produce a series of high-quality title descriptions quickly and efficiently.", "这样，我们就能快速高效地产出一系列高质量标题。"], ["up to", "一直到；多达", "The title of products on AliExpress can be set up to 128 characters.", "速卖通产品的标题最多可以设置128个字符。"], ["data analysis", "数据分析", "Use the data analysis tools to set the hot keywords.", "使用数据分析工具来设置热门关键词。"], ["pile up", "堆砌；堆积", "Do not pile up keywords in the title.", "不要在标题中堆砌关键词。"], ["added value", "附加值", "Products suitable for cross-border e-commerce are small, light and high added value.", "适合跨境电商销售的产品体积小、重量轻、附加值高。"], ["profit margin", "利润率；边际利润", "The price of burst sells is low, and the direct impact is that the profit margins are small.", "爆款价格低，直接影响就是利润率很小。"], ["page view", "访问量；浏览量", "Flow-increase products refer to the products that can increase page views for the shop.", "引流款指的是能为店铺增加浏览量的产品。"], ["inseparable from", "与……不可分的", "The operation of a shop is inseparable from profits.", "店铺的运营离不开利润。"], ["expected profit", "预期利润", "Profitability is determined by the seller's valuation on the expected profit of the products.", "盈利能力取决于卖家对产品预期利润的估值。"], ["decision making", "决策；判定", "Too many pictures will probably result in negative effect on the buyer's decision making process.", "图片太多可能会对买家的决策过程产生负面影响。"], ["buying experience", "购买体验", "Paragraph the description to enhance the buyer's buying experience.", "将描述分段以提升买家的购买体验。"]], "listen": [["Apple i VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"}, "ta": ["Store description is where we introduce the basic information of the store and show the advantages and strength of it, and thus cannot be neglected. In general, cross-border e-commerce stores can be divided into business stores and personal stores. These two types of store descriptions have different focuses. The business store description is richer in content, while the personal store description is usually more concise, and pays more attention to visual marketing tools such as store decoration.", "The business store description generally begins with a company profile, such as company history, main business scope, awards or patent certificate, well-known customers, etc. In addition, there may also be a brief introduction of the company's business philosophy or corporate culture, leaving a reliable first impression on the buyer. Due to the special nature of cross-border e-commerce, the store description will also introduce the supply channels, logistics, delivery time, return policy, contact information for after-sales service, etc. In the store description, the seller can also add some pictures properly, such as real shots of the factory, real shots of the packaging process, to make the store more credible.", "The description of personal stores is relatively concise, and focuses more on the store decoration.", "The design of the home page is significant for all cross-border e-commerce platforms. Taking AliExpress as an example, store decoration is divided into multiple parts, including shop sign, picture rotation, recommended products, and customized contents and so on.", "The first step of store decoration is to decide the overall style and color of the store. In this process, we should take full consideration if the selected style and color is consistent with our main business scope or brand image. For example, the store decoration of baby products is generally more lovely and warm, and the color is usually pink and white; and the store decoration of digital products or men's clothing is generally more concise and business-style, and the color is usually blue or black and white.", "Once the style and color of the store has been decided, we need to design a sign for the store. Shop sign appears at the top of home page. It is not only a simple sign of the store, but also shows the features of it. We can put the name of the store or the company, as well as some main product information in the shop sign. It is also allowed to include a link in the shop sign. The link can be the home page, information for a group of products or any single product. We can use links of the home page, activities, or products alternately according to the goals of marketing campaigns to make the full use of the shop sign.", "Picture rotation is generally located below the shop sign, displaying the advertising pictures in turns, showing the characteristics of products in a more intuitive and vivid way. We usually set the featured products, hot-selling products or new products as the advertising pictures. It should be noted that the size and proportion of pictures for the use of picture rotation must be uniform.", "The use of recommended products is very efficient. We can automatically select the products of the highest sales as the hot products recommendation. A store can add more than one module of recommended products. So in addition to hot products recommendation, we can also add recommendation for new products or seasonal products.", "Finally, we can show our products and store more comprehensively by adding customized contents. For example, you can add custom languages for the convenience of non-English speaking buyers. We can also show our social media accounts to buyers in this area to attract more fans, increase customer stickiness and loyalty."], "tb": ["Products are key to cross-border e-commerce. It can be said that good products can help companies gain the world. In general, products that are suitable for cross-border e-commerce sales have the following characteristics: small, light and high added value. In short, “small and beautiful” products are most suitable for sales on cross-border e-commerce platforms.", "When looking for products for online shops, pay attention to the product structure. There are mainly three types of cross-border e-commerce products: burst sells, flow-increase products and profitable products.", "Burst sells are hot products, with high flow, high exposure, large orders and other characteristics. However, burst sells are not the source of profits for shops. Usually, the price of burst sells is low, and the direct impact is that the profit margins are small, even no profit margins. Thus, it is recommended that shops only set 1-2 burst sells per store. Create burst sells by reducing prices, increasing discount rates, which will bring a lot of page views and orders in the short term for the shop, as well as promote the sale of other products.", "Flow-increase products refer to the products that can increase page views for the shop. Same as burst sells, the price of flow-increase products is also low, and they are not the main source of profits. It is recommended that each shop set about 5 flow-increase products, so that shops do not need to invest a lot to increase the flow. If shops choose flow-increase products and burst sells reasonably, it will help shops grow rapidly in the early stage.", "The operation of a shop is inseparable from profits, and profitable products are the main source of profits for shops. In general, in addition to burst sells and flow-increase products, other products in the shop are all profitable products. Profitability is determined by the seller's valuation on the expected profit of the products. The page view of this kind of products is not large, but the profit of a single product is high. The seller should reserve discount space for this kind of products, so the seller can discount them during the flow peak of platform or promotion period.", "Once we have decided the product structure of store, we need to have a more comprehensive understanding of the product category, so that we can better introduce and display the attributes and characteristic of the products in the product description. Although the major platforms have different rules about the product description, there are still some common skills and tricks:", "(1) Follow the “FAB” method, which refers to Feature, Advantage and Benefit;", "(2) Truthfully describe the products, otherwise there will be follow-up disputes such as products not as described;", "(3) Do not include too many pictures, otherwise the loading time will be too long and that will probably result in negative effect on the buyer's decision making process, best between 10-12 pictures;", "(4) Be as simple as possible in the product description, generally between 100-300 words;", "(5) Include logistics, payment, after-sales service and other information in the product description;", "(6) Paragraph the description to enhance the buyer's buying experience;", "(7) Make use of custom modules such as related sales to increase the sales of similar products, new or profitable products."], "tc": ["Title description is usually the first step of releasing products, and is crucial to cross-border e-commerce products. When buyers select products on third-party cross-border e-commerce platforms, they often search through keywords. A good title allows your products to be searched by buyers, maximizes the page views of products, increases product exposure, improves product ranking, as well as stimulates buyers desire to buy.", "A good title description should stimulate buyers' desire to buy directly after they see the title and without even clicking into the details. The first thing to follow is that you need to make sure the title description is a collection of product keywords. Therefore, we must put the core and most accurate keywords of products in the title description.", "In general, title description consists of core words, attribute words, long tail keywords and so on. In simple terms, the core words are the key words to describe the products. For example, the core word of a women's dress can be “dress” or “women's dress”. Attribute words are used to describes products' attributes, such as color, size, material, style, use, and so on. Long tail keywords, also known as flow words, refer to the keywords that do not have much relationship with the products, but can bring more page views, such as “plus size”, “free shipping”, “wholesale” and so on. After a period of shop operation, there will often be hundreds or even thousands of products, and many of them belong to the same category. If we are conscientious about each title description, the workload is too heavy. So for the same category of products, we can use title templates. That is, the core words stay the same, change attribute words accordingly, and replace the long tail keywords.", "For example, under the category of women's dress, we may upload a variety of products. Every product has different colors, styles, materials and so on. First, we can set core words for this category of products, such as “2020 Fashion Women's Dress”. Then it can be used as the beginning of all products' title under this category. Then we can set different attribute words according to the different attributes of products, such as different colors, length, etc., so there is a difference between each product. Finally, we can set the long tail keywords that will bring us more page views. In this way, we can produce a series of high-quality title descriptions quickly and efficiently.", "The rules of the major cross-border e-commerce platforms are not the same. For example, the title of products on AliExpress can be set up to 128 characters, but DHgate allows 140 characters. However, some tips of product description are common. Here are some tips:", "(1) Use the data analysis tools to set the hot keywords;", "(2) Try to put core words as early as possible, best in the first five words;", "(3) Capitalize the first letter of each keyword except for “the”, “a” and other prepositions;", "(4) Maximize the use of characters;", "(5) Do not pile up keywords;", "(6) Do not use keywords that do not match the products' real information;", "(7) Avoid the use of sensitive words, such as cheap, fake and so on;", "(8) Make the title as clear and coherent as possible."], "caseStore": [["1. Logo", "Logo is shown by Figure 3.1: SUNVENO — Focus on mom & baby travel product."], ["2. Brand Story", "Established in 2007, Sunveno is mainly specialized in mom & baby travel and infants sleeping series products. She has gradually grown up to a well-known maternity brand at home and abroad through more than ten years of development. We adhere to such operating conception as “Innovation, Quality, Service, Gratitude” continually. As the advocate for a brand new mother-and-baby life style, making every baby grow up healthily is the final goal we always insist."], ["3. Brand Positioning", "Focus on mom & baby travel product, Sunveno was originally engaged in the exports of high-end mother and baby textile. We inherited the professional technology and experience of the high-quality mother and baby products. We began to design and develop baby carriers, multifunctional mummy bags, travel bags, milk storage bags and other products from 2005. The existing sales channels involve major electronic business platforms and more than 2,000 physical cooperation shops."], ["4. Brand Products", "MAKING MOM LIFE EASIER — DIAPER BAG / BELLY BANDS SHAPERS / BABY CARRIER / BABY STUFF."], ["5. Brand Concept", "We adhere to independent design and excellent quality, which has won the recognition of consumers and high brand awareness in the industry."]], "caseProd": [["Product Introduction", "Are you looking for a comfortable sofa for your family? If so, this Double Chaise Longue Combination Sofa is highly recommended to you. Unlike the normal leather sofa, this sofa will give you a different using experience. The cushions you sit on are nice and firm. You'll never have to worry about sinking in. The more you sit in it the better. Sectional sofa with reversible chaise lounge. You can place the ottoman on either side of the sofa. So lay down on for a nap. And anyone can easily install it in 10 minutes. So what are you waiting for? Don't hesitate, it's worth buying!"], ["Features", "【MULTI USAGE】This modern sofa can provide enough seats for guests to visit, perfect for a small space and easy to lie down on for a nap.<br>【FIRM & COMFORTABLE】The cushions you sit on are nice and firm. You'll never have to worry about sinking in. The more you sit in it the better.<br>【SPACE SAVING】Small space reversible sectional sofa. Perfect for my small apartment, upstairs, loft and more.<br>【CONVERTIBLE DESIGN】Sectional sofa with reversible chaise lounge. You can place the ottoman on either side of the sofa.<br>【EASY ASSEMBLY】No tools needed and easy to follow instructions to assemble. All parts for assembling your sofa are located in the enclosed compartment on the bottom of the base section. Anyone can easily install it in 10 minutes. The product is packed in two packages. If you have just received one package, please wait patiently for another package, or contact us for information about the package."], ["Specifications", "(1) Product Dimensions: (76.38×49.6×35.04)″/(194×126×89)cm (L×W×H)<br>(2) Color: Beige<br>(3) Weight Capacity: 500 lb / 225 kg<br>(4) Material: Board Sponge<br>(5) Surface Material: Cotton and Linen<br>Package Includes: 1×Sofa"]], "task1": [["赢得这份合同对这家公司的成败至关重要。（crucial）", "The winning contract was crucial to the success of the company.", "crucial be crucial to + n.（对……至关重要）"], ["做出这个决定是为了共同的利益。（common）", "This decision was taken for the common good.", "common good 共同利益（固定搭配）"]], "task2": [["1", "to keep sth for sb/sth, so that it cannot be used by any other person or for any other reason", "reserve", "reserve v. 储备；保留（保留给某人专用）"], ["2", "logical and well organized; easy to understand and clear", "coherent", "coherent adj. 有条理的；清楚易懂的"]], "taskph": [["由于农产品与其他商品相比具有附加值不高、价格低的特点，更易遭受反倾销起诉。（added value）", "The agricultural products, which have low added value and low prices comparing to other commodities, are easily to be exposed to anti-dumping.", "added value 附加值；be exposed to 遭受"], ["良好的客户购买体验对提高电子商务平台的竞争力至关重要，国内外的电子商务平台越来越重视提高客户的购买体验。（buying experience）", "Good customer buying experience is important to improve the competitiveness of e-commerce platforms. Domestic and international e-commerce platforms are paying more and more attention to improving customers' buying experience.", "buying experience 购买体验；pay attention to 重视"]], "ex1": [["Due to the different supply channels, ________.（服装价格可能相差甚远）", "the price of clothing may vary a lot", "vary a lot 相差甚远"], ["We offer ________.（30天的退货政策）", "a 30-day return policy", "return policy 退货政策"], ["________（我们的业务范围是）men's and women's clothing.", "Our business scope is", "business scope 业务范围"], ["The contents of the sector expression in a company name ________.（应当与企业经营范围一致）", "shall conform to the business scope of the enterprise", "conform to 与……一致"], ["If an enterprise wants to have an invincible position in the market, ________.（就必须拥有自己独特的企业文化）", "it must possess its own unique corporate culture", "possess 拥有；corporate culture 企业文化"]], "ex2": [["volume", "C. the amount of sth"], ["accurate", "D. able to do sth in an exact way"], ["stimulate", "A. to encourage it to begin or develop further"], ["highlight", "B. to emphasize sth, so that people give it more attention"], ["ratio", "E. a relationship between two things when it is expressed in numbers or amounts"]], "ex2ans": "1-C（volume 数量）　2-D（accurate 精确地做某事）　3-A（stimulate 鼓励使其开始或进一步发展）　4-B（highlight 强调使人们更关注）　5-E（ratio 两个数量之间用数字表示的关系）", "ex3 (function(){
  let h='<h2>写作任务：How to introduce your online store 如何介绍自己的线上店铺</h2>';
  h+='<div class="note"><b>店铺描述五步法</b>（对应 Text A）：① 开场欢迎+定位 → ② 主营业务范围 → ③ 优势与实力（证书/工厂/专利）→ ④ 物流与售后保障 → ⑤ 促销与引流结尾。写 100—300 词，语气热情专业。</div>';
  h+='<h3>一、现用例句弹药库（每句可直接抄进作文）</h3><div class="card">';
  D.wsteps.forEach(s=>{h+=`<p style="margin:10px 0"><b style="color:#0d47a1">${s[0]}</b><br>${s[1]}</p>`;});
  h+='</div><h3>二、范文 1 · 商家店（Business Store · 3C 数码店）</h3><div class="write-ex"><div class="tt">TechStar — Your Reliable Electronics Partner <button class="speak" onclick="speak(document.getElementById(\'wx1\').textContent)">🔊</button></div><div id="wx1">Welcome to TechStar! We are a professional cross-border e-commerce store <span class="hl">specializing in</span> digital products, including phone cases, chargers and Bluetooth earphones. <span class="hl">Established in 2015</span>, our company has grown into a well-known brand at home and abroad. <span class="hl">Our business scope covers</span> more than 300 electronic products, and we <span class="hl">release new products</span> every season. All products are <span class="hl">directly supplied by the factory</span>, so the prices are competitive and the quality is credible. Our company owns 3 patent certificates, and <span class="hl">detailed product description and high quality pictures make our store more credible</span>. <span class="hl">Due to the special nature of cross-border e-commerce</span>, we introduce our supply channels and logistics honestly: the products will be delivered within 48 hours by DHL. We <span class="hl">offer a 30-day return policy and 24/7 after-sales service</span>. If you have any problems, please contact us and we will reply within 12 hours. <span class="hl">Follow our social media accounts to get the latest news and coupons</span>!</div><div style="margin-top:8px"><button class="ans" onclick="tgB(this,\'w1n\')">亮点解析</button><div class="ansbox" id="w1n">黄金结构：欢迎→定位（specializing in）→资历（Established in…）→业务范围（business scope covers）→实力（patent certificates）→诚信（supply channels and logistics honestly）→保障（30-day return policy / 24-7）→互动结尾（follow us）。全部例句来自课文与词组表，背下来即可迁移到任何品类。</div></div></div>';
  h+='<h3>三、范文 2 · 个人店（Personal Store · 妈妈婴童店）</h3><div class="write-ex"><div class="tt">Sunny Baby — Making Mom Life Easier <button class="speak" onclick="speak(document.getElementById(\'wx2\').textContent)">🔊</button></div><div id="wx2">Hi, dear buyers, <span class="hl">welcome to Sunny Baby</span>! Different from big business stores, our store is more concise, and we pay more attention to <span class="hl">visual marketing tools such as store decoration</span>. <span class="hl">Focus on mom & baby travel products</span>, we began to design and develop baby carriers, multifunctional mummy bags and travel bags in 2020. Every product is <span class="hl">small, light and high added value</span>, which is most suitable for cross-border shopping. As a mother myself, I <span class="hl">adhere to such operating conception as "Safety, Comfort, Service"</span>, because making every baby grow up healthily is the final goal I always insist. We <span class="hl">offer a 30-day return policy</span>, and real shots of the packaging process are shown in the picture gallery <span class="hl">to make the store more credible</span>. You can also add custom languages for the convenience of non-English speaking buyers — just message us in your language! <span class="hl">Increase customer stickiness and loyalty</span> by following us, and a registration coupon is waiting for your first order.</div><div style="margin-top:8px"><button class="ans" onclick="tgB(this,\'w2n\')">亮点解析</button><div class="ansbox" id="w2n">个人店写法：语气更亲切（Hi, dear buyers），承认店铺 small / concise 但突出 visual marketing tools；用第一人称故事（As a mother myself）替代公司证书；引用课文句 "real shots of the packaging process" "to make the store more credible" 是高分亮点。</div></div></div>';
  h+='<h3>四、常见失分点</h3><div class="card">';
  D.wbad.forEach(b=>{h+=`<p>❌ <b>${b[0]}</b>　<span style="color:#555">${b[1]}</span></p>`;});
  h+='</div><h3>五、课后练笔</h3><div class="note">选一个你熟悉或想做的品类（女装 / 数码配件 / 宠物用品 / 运动户外），按“五步法”写一段 120—180 词的店铺描述，至少用上：<b>specializing in / business scope / consistent with / return policy / credible / customer stickiness</b> 六个表达。</div>';
  document.getElementById('p5').innerHTML=h;
})();

/* ---------- Tab6 单词闯关 ---------- */
const G_WORDS=[["conscientious","认真的；一丝不苟的"],["comprehensive","全面的；广泛的"],["profitability","盈利能力"],["specification","规格；明确说明"],["philosophy","哲学；经营理念"],["exposure","曝光；曝光量"],["stimulate","激发；促进"],["attribute","属性；特征"],["template","模板；样板"],["coherent","有条理的"],["intuitive","直观的"],["proportion","比例"],["category","类别"],["maximize","使最大化"],["credible","可信的"],["campaign","营销活动"],["accurate","准确的"],["conscientious","认真的"],["alternative","可替代的"],["dispute","纠纷"]];
const G_SPELL=[["credible","可信的"],["exposure","曝光；曝光量"],["stimulate","激发；促进"],["template","模板；样板"],["conscientious","一丝不苟的"],["profitability","盈利能力"],["comprehensive","全面的"],["specification","规格"],["maximize","使最大化"],["category","类别"],["proportion","比例"],["campaign","营销活动"],["attribute","属性"],["coherent","有条理的"],["conscientious","认真的"]];
const G_MATCH=[["burst sells","爆款（高流量不赚钱）"],["flow-increase products","引流款（增浏览量）"],["profitable products","利润款（利润来源）"],["picture rotation","轮播图"],["shop sign","店招"],["title templates","标题模板"],["long tail keywords","长尾关键词"],["customer stickiness","用户黏性"]];
let G={lv:1,score:0,lives:3,streak:0,qi:0,order:[],t:0,timer:null,best:+(localStorage.getItem('p32best')||0)};
(function(){
  document.getElementById('p6').innerHTML=`
  <h2>单词闯关 · 三关挑战</h2>
  <div class="note"><b>规则：</b>第一关 听音识词（🔊读音→选词，12 秒/题）→ 第二关 中译英拼写（看中文打单词，20 秒/题）→ 第三关 词组速配（60 秒配对 8 组）。答对+10 分，连击×2 加成；答错或超时扣一条命，命尽游戏结束。</div>
  <div class="card"><div class="ghead"><div class="gstat"><span>关卡：<b id="glv">1</b>/3</span><span>得分：<b id="gsc">0</b></span><span>连击：<b id="gst">0</b></span><span>生命：<b id="glf">❤❤❤</b></span><span>最高分：<b id="gbp">${G.best}</b></span></div><button class="ans" id="gstart" onclick="gStart()">开始挑战</button></div>
  <div class="gbar"><i id="gbar" style="width:100%"></i></div>
  <div id="gzone"><p style="color:#888;text-align:center;padding:30px 0">点击「开始挑战」进入第一关：听音识词</p></div></div>`;
})();
function gUI(){document.getElementById('glv').textContent=G.lv;document.getElementById('gsc').textContent=G.score;document.getElementById('gst').textContent=G.streak;document.getElementById('glf').textContent='❤'.repeat(Math.max(0,G.lives))||'—';document.getElementById('gbp').textContent=G.best;}
function gBar(sec){const b=document.getElementById('gbar');b.style.width='100%';clearInterval(G.timer);const t0=Date.now();G.t=sec;
 G.timer=setInterval(()=>{const left=Math.max(0,sec-(Date.now()-t0)/1000);b.style.width=(left/sec*100)+'%';if(left<=0){clearInterval(G.timer);gWrong(true);}},100);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gStart(){G={...G,lv:1,score:0,lives:3,streak:0,qi:0};gUI();gQ();}
function gNext(){G.qi++;if(G.qi>=10){G.lv++;G.qi=0;if(G.lv>3){return gWin();}if(G.lv===3)return gMatch();gQ();}
 else if(G.qi===0&&G.lv===1)gQ();else gQ();}
function gQ(){
  gUI();
  if(G.lv===2){gSpell();return;}
  const pool=G_WORDS.filter(w=>w[0]!==undefined);
  const correct=pool[Math.floor(Math.random()*pool.length)];
  const opts=shuffle([correct,...shuffle(pool.filter(w=>w!==correct)).slice(0,3)]);
  G.cur=correct;
  document.getElementById('gzone').innerHTML=`<p style="text-align:center;color:#666">第 ${G.qi+1}/10 题 · 听读音选单词</p>
   <p style="text-align:center;margin:16px 0"><button class="audbtn" style="font-size:20px;padding:12px 34px" onclick="speakSlow('${correct[0]}')">🔊 点击听发音（可重复）</button></p>
   <div class="gopt">${opts.map(o=>`<button onclick="gPick(this,'${o[0]}')">${o[0]}</button>`).join('')}</div><div class="gmsg" id="gmsg"></div>`;
  gBar(12);
}
function gSpell(){
  const w=G_SPELL[Math.floor(Math.random()*G_SPELL.length)];G.cur=w;
  const hint=w[0][0].toUpperCase()+w[0].slice(1,2).replace(/./,'_');
  document.getElementById('gzone').innerHTML=`<p style="text-align:center;color:#666">第 ${G.qi+1}/10 题 · 看中文拼写单词（20 秒）</p>
   <p style="text-align:center;font-size:26px;font-weight:800;margin:14px 0">${w[1]}</p>
   <p style="text-align:center;color:#999">首字母提示：<b>${w[0][0].toUpperCase()}</b>　共 ${w[0].length} 个字母　<button class="speak" onclick="speakSlow('${w[0]}')">🔊 听发音提示（扣2分）</button></p>
   <input id="gin" autocomplete="off" placeholder="输入英文单词后回车">
   <div class="gmsg" id="gmsg"></div>`;
  document.getElementById('gin').focus();
  document.getElementById('gin').onkeydown=e=>{if(e.key==='Enter')gCheckSpell();};
  G.spellUsed=false;gBar(20);
}
function gCheckSpell(){
  const v=document.getElementById('gin').value.trim();
  if(!v)return;
  if(v.toLowerCase()===G.cur[0].toLowerCase()){gRight();}
  else{document.getElementById('gmsg').textContent='❌ 拼写错误，再想想！';document.getElementById('gin').style.borderColor='#c62828';
    setTimeout(()=>document.getElementById('gin').style.borderColor='#1976d2',400);}
}
function gPick(btn,w){
  clearInterval(G.timer);
  document.querySelectorAll('.gopt button').forEach(b=>b.disabled=true);
  if(w===G.cur[0]){btn.classList.add('right');gRight();}
  else{btn.classList.add('wrong');document.querySelectorAll('.gopt button').forEach(b=>{if(b.textContent===G.cur[0])b.classList.add('right');});gWrong(false);}
}
function gRight(){
  const bonus=(G.spellUsed?-2:0);
  G.streak++;const gain=(10+Math.min(G.streak-1,5)*2)+bonus;
  G.score=Math.max(0,G.score+gain);gUI();
  const m=document.getElementById('gmsg');if(m)m.innerHTML=`✅ +${gain} 分${G.streak>1?`（连击 ${G.streak}！）`:''}`;
  setTimeout(gNext,650);
}
function gWrong(timeout){
  G.lives--;G.streak=0;gUI();
  const m=document.getElementById('gmsg');
  if(m)m.innerHTML=timeout?'⏰ 超时！':'❌ 答错了！'+(G.cur?` 正确答案：<b style="color:#2e7d32">${G.cur[0]}</b>`:'');
  if(G.lives<=0){clearInterval(G.timer);setTimeout(()=>{gOver();},1400);}
  else setTimeout(gNext,1400);
}
function gMatch(){
  gUI();
  let pairs=shuffle(G_MATCH.map((p,i)=>i));
  const left=shuffle(pairs.map(i=>`<div class="mchip en" data-i="${i}" onclick="mPick(this)">${G_MATCH[i][0]}</div>`).join(''));
  const right=shuffle(pairs.map(i=>`<div class="mchip cn" data-i="${i}" onclick="mPick(this)">${G_MATCH[i][1]}</div>`).join(''));
  document.getElementById('gzone').innerHTML=`<p style="color:#666">第三关 · 60 秒内把 8 组英文词组与中文释义配对（先点英文再点中文）</p><div class="ggrid">${left}</div><div class="ggrid">${right}</div><div class="gmsg" id="gmsg"></div>`;
  G.msel=null;G.mleft=8;gBar(60);
}
function mPick(el){
  if(el.classList.contains('done'))return;
  if(!G.msel){G.msel=el;el.style.background='#e3f0fd';return;}
  const a=G.msel,b=el;
  if(a.dataset.i===b.dataset.i&&a.classList.contains('en')!==b.classList.contains('en')){
    a.classList.add('done');b.classList.add('done');a.style.background='';G.msel=null;G.mleft--;
    G.score+=15;gUI();
    if(G.mleft===0){clearInterval(G.timer);gWin();}
  }else{a.classList.add('wrong');b.classList.add('wrong');setTimeout(()=>{a.classList.remove('wrong');b.classList.remove('wrong');a.style.background='';},350);G.msel=null;G.lives--;G.streak=0;gUI();if(G.lives<=0){clearInterval(G.timer);gOver();}}
}
function gWin(){
  clearInterval(G.timer);
  if(G.score>G.best){G.best=G.score;localStorage.setItem('p32best',G.best);gUI();}
  document.getElementById('gzone').innerHTML=`<div style="text-align:center;padding:30px 0"><p style="font-size:42px">🏆</p><p style="font-size:20px;font-weight:800;color:#0d47a1">三关全部通关！</p><p style="margin:8px 0">最终得分 <b style="color:#c62828;font-size:26px">${G.score}</b>　历史最高 <b>${G.best}</b></p><button class="ans" onclick="gStart()">再挑战一次</button></div>`;
}
function gOver(){
  if(G.score>G.best){G.best=G.score;localStorage.setItem('p32best',G.best);}
  document.getElementById('gzone').innerHTML=`<div style="text-align:center;padding:30px 0"><p style="font-size:42px">💪</p><p style="font-size:20px;font-weight:800;color:#c62828">生命耗尽，游戏结束</p><p style="margin:8px 0">本次得分 <b>${G.score}</b>　历史最高 <b>${G.best}</b></p><button class="ans" onclick="gStart()">重新挑战</button></div>`;
}

/* 高亮课文生词 */
(function(){
  const terms=[];
  D.core.forEach(w=>terms.push([w[0],w[1]]));
  D.book.forEach(w=>terms.push([w[0],w[2]]));
  D.phrases.forEach(w=>terms.push([w[0],w[1]]));
  terms.push(["shop sign","店招"],["flow-increase products","引流款"],["burst sells","爆款"],["profitable products","利润款"],["brand story","品牌故事"],["brand positioning","品牌定位"],["brand concept","品牌理念"],["supply channels","供货渠道"],["packaging process","包装过程"],["customized contents","定制内容"],["recommendation","推荐"],["sectional sofa","组合沙发"],["ottoman","软凳"],["diaper bag","妈咪包"],["baby carrier","婴儿背带"],["anti-dumping","反倾销"],["FAB","FAB法：特征-优势-利益"],["mom & baby","母婴"],["beige","米色"],["chaise longue","贵妃椅"]);
  terms.sort((a,b)=>b[0].length-a[0].length);
  document.querySelectorAll('#p3 .tp').forEach(p=>{
    let html=p.innerHTML;
    terms.forEach(t=>{
      const esc=t[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      html=html.replace(new RegExp('(?<!<(b |span )[^>]*)\\b('+esc+')\\b(?!([^<]*)(<(span|b)[^>]*>))','gi'),(m)=>`<b class="nw" data-cn="${t[1]}">${m}</b>`);
    });
    p.innerHTML=html;
  });
})();
</script>
